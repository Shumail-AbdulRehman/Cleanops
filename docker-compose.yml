services:
  backend:
    image: ${BACKEND_IMAGE:-shumail47891/fyp:backend}
    restart: unless-stopped
    volumes: &verification-release-volumes
      - ${VERIFICATION_RELEASES_DIRECTORY:-./backend/verification-releases}:/run/hygeneops/releases:ro
    environment: &backend-environment
      PORT: 8080
      GOOGLE_MAP_API_KEY: ${GOOGLE_MAP_API_KEY:-}
      GOOGLE_MAP_BROWSER_API_KEY: ${GOOGLE_MAP_BROWSER_API_KEY:-}
      GOOGLE_MAP_ID: ${GOOGLE_MAP_ID:-}
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_URL: ${FRONTEND_URL:?Set exact HTTPS frontend origins}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?Set a strong unique access signing key}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Set a separate strong refresh signing key}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY:-15m}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY:-7d}
      STAFF_REFRESH_TOKEN_EXPIRY: ${STAFF_REFRESH_TOKEN_EXPIRY:-30d}
      STAFF_PUSH_ENABLED: ${STAFF_PUSH_ENABLED:-false}
      STAFF_EXPO_PROJECT_ID: ${STAFF_EXPO_PROJECT_ID:-68ea9f06-53f5-444f-8760-329fd733ae8e}
      EXPO_PUSH_ACCESS_TOKEN: ${EXPO_PUSH_ACCESS_TOKEN:-}
      STAFF_CHECKIN_GRACE_MINUTES: ${STAFF_CHECKIN_GRACE_MINUTES:-10}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-replace_me}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-replace_me}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-replace_me}
      VERIFICATION_QR_SECRET: ${VERIFICATION_QR_SECRET:-}
      VERIFICATION_SLOT_SECRET: ${VERIFICATION_SLOT_SECRET:-}
      VERIFICATION_MIN_NATIVE_VERSION: ${VERIFICATION_MIN_NATIVE_VERSION:-2.0.0}
      VERIFICATION_SPATIAL_RECAPTURE_ENABLED: ${VERIFICATION_SPATIAL_RECAPTURE_ENABLED:-false}
      VERIFICATION_QR_KEY_ID: ${VERIFICATION_QR_KEY_ID:-v1}
      MAX_TASK_REASSIGNMENTS: ${MAX_TASK_REASSIGNMENTS:-3}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLEF_MODEL: ${CLEF_MODEL:-clef}
      CLEF_TIMEOUT_MS: ${CLEF_TIMEOUT_MS:-30000}
      CLEF_SCREENING_CONFIDENCE_THRESHOLD: ${CLEF_SCREENING_CONFIDENCE_THRESHOLD:-0.9}
      CLEF_CONFIDENCE_THRESHOLD: ${CLEF_CONFIDENCE_THRESHOLD:-}
      CLEF_THRESHOLD_VERSION: ${CLEF_THRESHOLD_VERSION:-unvalidated-no-threshold}
      CLEF_RELEASE_RECORD_PATH: ${CLEF_RELEASE_RECORD_PATH:-}
      CLEF_RELEASE_RECORD_SHA256: ${CLEF_RELEASE_RECORD_SHA256:-}
      NODE_ENV: production
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    image: ${FRONTEND_IMAGE:-shumail47891/fyp:frontend}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
