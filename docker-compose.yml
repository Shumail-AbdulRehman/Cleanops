services:
  backend:
    image: ${BACKEND_IMAGE:-shumail47891/fyp:backend}
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_URL: http://${PUBLIC_HOST:-161.118.180.138}:${FRONTEND_PORT:-5173}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-replace_me}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-replace_me}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY:-15m}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-replace_me}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-replace_me}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-replace_me}
      NODE_ENV: production
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    image: ${FRONTEND_IMAGE:-shumail47891/fyp:frontend}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
